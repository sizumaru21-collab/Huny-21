<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huny — Listen to anything</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">H</span>
      <span class="brand-name">huny</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="home">Home</button>
      <button class="nav-item" data-view="search">Search</button>
      <button class="nav-item" data-view="liked">Liked Songs</button>
    </nav>

    <button id="themeToggle" class="theme-toggle" title="Toggle light / dark">
      <span class="dot"></span>
    </button>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-box">
        <input id="searchInput" placeholder="Search any song or artist…" autocomplete="off">
      </div>
    </div>

    <section id="homeView" class="view">
      <h2>Trending on Audius</h2>
      <div id="trendingGrid" class="grid"></div>
    </section>

    <section id="searchView" class="view" hidden>
      <h2 id="searchHeading">Results</h2>
      <div id="resultsGrid" class="grid"></div>
    </section>

    <section id="likedView" class="view" hidden>
      <h2>Liked Songs</h2>
      <div id="likedGrid" class="grid"></div>
    </section>
  </main>

  <footer class="player-bar">
    <div class="np">
      <img id="npArt" class="np-art" alt="">
      <div class="np-meta">
        <span id="npTitle" class="np-title">Nothing playing</span>
        <span id="npArtist" class="np-artist">Search for a song to start</span>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playBtn">▶</button>
        <button id="nextBtn">⏭</button>
      </div>
      <div class="progress-row">
        <span id="currentTime" class="time">0:00</span>
        <input id="seek" class="seek" type="range" min="0" max="100" value="0">
        <span id="duration" class="time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <input id="volume" class="seek volume" type="range" min="0" max="1" step="0.01" value="1">
    </div>
  </footer>
</div>

<audio id="audio"></audio>
<script src="script.js?v=2"></script>
</body>
</html>
